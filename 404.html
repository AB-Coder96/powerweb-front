
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Redirecting...</title>

    <script>
        (function () {
            var locationInfo = window.location;

            // Web_Base=/ means the frontend lives at the domain root.
            var siteBase = "/";

            // Avoid another redirect if the root itself is missing.
            if (locationInfo.pathname === siteBase) {
                return;
            }

            // Preserve the originally requested React route.
            var originalPath =
                locationInfo.pathname +
                locationInfo.search +
                locationInfo.hash;

            // Return to the SPA entry page once.
            var destination =
                locationInfo.origin +
                siteBase +
                "?redirect=" +
                encodeURIComponent(originalPath);

            locationInfo.replace(destination);
        })();
    </script>
</head>
<body>
    <p>Redirecting to the website...</p>
</body>
</html>
